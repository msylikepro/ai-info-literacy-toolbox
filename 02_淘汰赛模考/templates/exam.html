{% extends 'base.html' %}{% block content %}
<div class="examtop"><div><a href="/">← 控制台</a><h1 id="title">加载试卷中</h1><p id="meta" class="muted"></p></div><div id="clock" class="clock">--:--</div></div>
<div id="error" class="notice hidden"></div><div class="examgrid"><aside class="card"><h2>作答进度</h2><div id="numbers" class="numbers"></div><div id="timingSummary"></div><p id="rule" class="muted">提交或跳过后不能返回上一题。</p><button id="submit" class="primary wide" onclick="submitExam()">提前交卷</button></aside>
<section class="card"><div id="question"></div><div id="liveActions" class="row between"><button id="skip" onclick="advance(true)">跳过此题</button><button id="next" class="primary" onclick="advance(false)">下一题</button></div><div id="reviewActions" class="row between" hidden><button id="prev" onclick="move(-1)">上一题解析</button><button id="reviewNext" onclick="move(1)">下一题解析</button></div></section></div>
<script>const aid={{ aid }};let exam=null,index=0,savePending=Promise.resolve(),clockEnd=0,timer=null,moving=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
const signed=n=>Number(n)>0?'+'+n:String(n);
function questionOutcome(q){if(['correct','wrong','unanswered'].includes(q.outcome))return q.outcome;if(!q.answer?.length)return 'unanswered';return [...new Set(q.answer)].sort().join('|')===[...new Set(q.correct||[])].sort().join('|')?'correct':'wrong'}
function questionRule(q){return exam.scoring_rules?.[q.type]||{correct:exam.correct_points,wrong:-1,unanswered:0}}
function fail(s){const e=document.getElementById('error');e.textContent=s;e.classList.remove('hidden')}
async function load(){const r=await fetch('/api/attempt/'+aid),d=await r.json();if(!r.ok)return fail(d.error||'无法加载试卷');exam=d;document.getElementById('error').classList.add('hidden');if(!d.submitted_at)index=d.current_position;else index=Math.min(index,d.question_count-1);clockEnd=d.remaining_seconds===null?null:Date.now()+d.remaining_seconds*1000;render();clearInterval(timer);if(!d.submitted_at&&d.deadline!==null){timer=setInterval(tick,500);tick()}}
function render(){const done=!!exam.submitted_at,team=exam.kind.includes('team'),training=exam.kind.startsWith('training_'),count=exam.question_count,q=done?exam.questions[index]:exam.questions[0],scoring=questionRule(q),multi=q.type==='multi',type=multi?'多选':q.type==='judge'?'判断':'单选';
document.getElementById('title').textContent=(team?(training?'团队练习':'团队对抗'):(training?'个人练习':'个人对抗'))+(done?' · 成绩复盘':' · 正在作答');
document.getElementById('meta').textContent=done?`得分 ${exam.score} / ${exam.max_score} · 用时 ${fmt(exam.duration_seconds)}`:`共 ${count} 题 · 满分 ${exam.max_score} 分 · 当前${type}：答对 ${signed(scoring.correct)} / 答错 ${signed(scoring.wrong)} / 未答 ${signed(scoring.unanswered)} · 只能向前作答`;
document.getElementById('submit').hidden=done;document.getElementById('clock').textContent=done?fmt(exam.duration_seconds):(clockEnd===null?'不限时':fmt(Math.max(0,Math.ceil((clockEnd-Date.now())/1000))));
document.getElementById('numbers').innerHTML=Array.from({length:count},(_,i)=>{let state=done?({correct:'answered',wrong:'wrong',unanswered:'skipped'}[questionOutcome(exam.questions[i])]):exam.progress[i];return done?`<button class="number ${state} ${i===index?'active':''}" onclick="go(${i})">${i+1}</button>`:`<span class="number ${state} ${i===index?'active':''}">${i+1}</span>`}).join('');
document.getElementById('timingSummary').innerHTML=done?`<h3>每题用时</h3><ol class="timings">${exam.questions.map((q,i)=>`<li>第 ${i+1} 题：${q.duration_seconds===null?'无用时记录':q.duration_seconds+' 秒'}</li>`).join('')}</ol>`:'';
let html=`<div class="qhead"><span class="pill">第 ${index+1} / ${count} 题</span><span class="muted">${type}${q.module?' · '+esc(q.module):''}</span></div><h2 class="stem">${esc(q.stem)}</h2>`;
html+=q.options.map(o=>`<label class="option ${q.answer.includes(o.key)?'selected':''}"><input ${done?'disabled':''} type="${multi?'checkbox':'radio'}" name="choice" value="${esc(o.key)}" ${q.answer.includes(o.key)?'checked':''} onchange="choose()"><strong>${esc(o.key)}</strong><span>${esc(o.text)}</span></label>`).join('');
if(done){const result=questionOutcome(q),resultLabel={correct:'答对',wrong:'答错',unanswered:'未答'}[result];html+=`<div class="review ${result==='wrong'?'bad':result==='unanswered'?'unanswered':''}"><strong>本题 ${resultLabel}（${signed(q.points)} 分）</strong><p>本题用时：${q.duration_seconds===null?'无用时记录':q.duration_seconds+' 秒'}</p><p>正确答案：${esc(q.correct.join('、'))}</p><p>解析：${esc(q.explanation||'暂无解析')}</p><small>来源：${esc(q.source||'未标注')} · 原编号：${esc(q.original_id||'无')}</small></div>`}
document.getElementById('question').innerHTML=html;document.getElementById('liveActions').hidden=done;document.getElementById('reviewActions').hidden=!done;
if(done){document.getElementById('prev').disabled=index===0;document.getElementById('reviewNext').disabled=index===count-1}else{document.getElementById('next').disabled=!q.answer.length;document.getElementById('next').textContent=index===count-1?'作答并交卷':'下一题';document.getElementById('skip').textContent=index===count-1?'跳过并交卷':'跳过此题'}}
function go(i){if(!exam.submitted_at)return;index=i;render()}function move(delta){go(Math.min(exam.question_count-1,Math.max(0,index+delta)))}
function choose(){const chosen=[...document.querySelectorAll('input[name=choice]:checked')].map(x=>x.value),i=index;exam.questions[0].answer=chosen;render();savePending=savePending.then(async()=>{const r=await fetch(`/api/attempt/${aid}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i,answer:chosen})});if(!r.ok){fail('答案保存失败，请刷新页面检查。');await load()}}).catch(()=>fail('网络异常，答案可能尚未保存。'))}
async function advance(skip){if(moving)return;const rule=questionRule(exam.questions[0]);if(skip&&!confirm(`跳过后无法返回，此题按未答 ${signed(rule.unanswered)} 分计。确定跳过吗？`))return;moving=true;try{await savePending;const r=await fetch(`/api/attempt/${aid}/advance`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index,skip})});const d=await r.json();if(!r.ok){fail(d.error||'操作失败，请刷新页面。');return}if(d.attempt.submitted_at)index=0;await load()}catch(e){fail('网络异常，请刷新页面检查进度。')}finally{moving=false}}
async function submitExam(){const labels={single:'单选',multi:'多选',judge:'判断'},rules=Object.entries(exam.scoring_rules||{}).filter(([,rule])=>rule.count>0).map(([kind,rule])=>`${labels[kind]} ${signed(rule.unanswered)} 分`).join('、');if(!confirm(`确定提前交卷？未作答的题目按各题型未答规则结算${rules?'（'+rules+'）':''}，交卷后不能返回。`))return;await doSubmit()}
async function doSubmit(){await savePending;const r=await fetch(`/api/attempt/${aid}/submit`,{method:'POST'});if(!r.ok)return fail('交卷失败，请刷新重试。');clearInterval(timer);index=0;await load();window.scrollTo(0,0)}
function tick(){if(exam.submitted_at||clockEnd===null)return;const left=Math.max(0,Math.ceil((clockEnd-Date.now())/1000));document.getElementById('clock').textContent=fmt(left);if(left===0){clearInterval(timer);doSubmit()}}
load();</script>{% endblock %}
